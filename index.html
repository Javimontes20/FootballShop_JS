<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="styles.css">

<body>
    <header>

            <h1>FootballShop</h1>

                <li>Productos</li>
                <li>Blog</li>
                <li>Contacto</li>
            </ul>
        </div>
        <div>
            <ul>

        <div>
